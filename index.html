<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de servicio</title>
</head>
<body>

<h1>Ejemplo de servicio</h1>

<button onclick="ejecutar()">Ejecuta</button>

<script>
function ejecutar() {
    fetch("https://marcosomar.infinityfreeapp.com/nombre.php", {
        method: "GET"
    })
    .then(response => response.text())
    .then(data => {
        alert(data);
    })
    .catch(error => {
        alert("Error al llamar al servicio");
        console.error(error);
    });
}
</script>


</body>
</html>
